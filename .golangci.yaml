version: "2"
linters:
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - decorder
    - exhaustive
    - goconst
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
